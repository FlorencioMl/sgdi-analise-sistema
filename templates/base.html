<!DOCTYPE html>
<html>
<head>
    <title>SGDI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header">
    <h1>SGDI</h1>

    <div class="menu">
        {% if session.usuario_id %}
            <a href="/">Início</a>
            <a href="/nova_demanda">Nova Demanda</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/auditoria">🔍 Auditoria</a>
            <a href="/meu_token">🔑 API</a>
            <a href="/logout">Sair</a>

            <form action="/buscar" method="GET">
                <input type="text" name="q" placeholder="Buscar...">
            </form>

            <!-- FIX: nome do usuário dentro de um badge com ícone -->
            <span style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: #fff;
                color: #1a202c;
                font-size: 0.82rem;
                font-weight: 600;
                padding: 0.3rem 0.75rem;
                border-radius: 999px;
                border: 1px solid #e2e8f0;
                white-space: nowrap;
            ">
                <span style="
                    width: 24px;
                    height: 24px;
                    background: #7c3aed;
                    border-radius: 50%;
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 0.75rem;
                    color: #fff;
                    flex-shrink: 0;
                ">👤</span>
                {{ session.usuario_nome }}
            </span>
        {% else %}
            <a href="/login">Login</a>
            <a href="/cadastro">Cadastro</a>
        {% endif %}
    </div>
</div>

<div class="container">
{% block content %}{% endblock %}
</div>

</body>
</html>
